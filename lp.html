<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARKLIGHT 星灯の航路</title>
<!--
  iPhone Duo の右の列で「見切れ」が出るかを比べる、架空のゲーム（ARKLIGHT）の LP。
    ?mode=plain  最適化なし。よくある LP の作り。
    ?mode=duo    最適化あり。KV・ヘッダー・カルーセル・シートを右の列の奥（画面の物理的な右端）まではみ出させ、
                 その副作用（横揺れ・縮小）を止める。列の無い端末では --gutter が 0 になり、はみ出さない。
    ?open=1      読み込みの 1.5 秒後に最初の場所のシートを開く。
    ?mid=1       （open=1 と合わせて）シートを開く途中の位置（translateX(50%)）で止める。撮影用。
    ?slow=1      シートの動きを 3 秒にする（途中を撮るため）。
    ?at=chars    読み込み時にカルーセルの段までスクロールする。
  絵は assets/ の JPEG。assets/src/ の scene.js・scenes.js・gen.mjs で手続き的に描いたもの（node gen.mjs で作り直す）。
-->
<style>
  :root { --page: #060917; --ink: #f3efe6; --gold: #e8c98f; --muted: #98a2c8; --sheet-ms: 450ms; --gutter: 0px;
    --serif: "Bodoni 72", Didot, "Hiragino Mincho ProN", serif; --mincho: "Hiragino Mincho ProN", "Hiragino Mincho Pro", serif; }
  html { background: var(--page); color: var(--ink); }
  body { margin: 0; font: 15px/1.75 "Hiragino Sans", -apple-system, system-ui, sans-serif; }
  h1, h2, h3, p { margin: 0; }

  /* ヘッダー：絵の上に重なる、半透明の濃い帯。 */
  .header { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: 56px; }
  .header-bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box;
    background: rgba(6, 9, 23, .62); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border-bottom: 1px solid rgba(232, 201, 143, .28); }
  .logo { font-family: var(--serif); font-size: 17px; letter-spacing: .3em; color: var(--ink); }
  .menu { width: 24px; height: 9px; border-block: 1px solid var(--gold); }

  /* キービジュアル。右に環を持つ巨大な月。右端で切れると月が欠ける。 */
  .hero { position: relative; box-sizing: border-box; height: 660px; overflow: hidden; display: grid; align-content: end; padding: 0 24px 120px; background: #0a0e2a; }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: left top; }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(0deg, rgba(5, 7, 22, .9) 0%, rgba(5, 7, 22, .55) 22%, rgba(5, 7, 22, 0) 46%); }
  .hero-copy { position: relative; z-index: 2; display: grid; gap: 6px; justify-items: start; }
  .title { font-family: var(--serif); font-weight: 400; font-size: 54px; line-height: 1.05; letter-spacing: .05em; text-shadow: 0 2px 28px rgba(255, 214, 168, .35); }
  .title-ja { font-family: var(--mincho); font-weight: 600; font-size: 19px; letter-spacing: .6em; color: var(--gold); }
  .lead { margin-top: 10px; font-family: var(--mincho); font-size: 14px; letter-spacing: .08em; color: rgba(243, 239, 230, .85); }
  .cta { margin-top: 14px; padding: 12px 30px; border: 1px solid var(--gold); border-radius: 2px; background: rgba(232, 201, 143, .16);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--ink); font-family: var(--mincho); font-weight: 600; letter-spacing: .2em; }
  .release { margin-top: 6px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }

  /* 行き先のカルーセル。次のカードが右に覗く。 */
  .section { display: grid; gap: 20px; padding: 56px 0 0; }
  .section-head { display: grid; gap: 4px; padding: 0 24px; }
  .section h2 { font-family: var(--mincho); font-weight: 600; font-size: 24px; letter-spacing: .12em; }
  .section-head p { font-size: 13px; color: var(--muted); }
  .chars { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 24px; scroll-padding: 0 24px; scrollbar-width: none; }
  .char { flex: 0 0 78%; height: 400px; border: 0; padding: 0; font: inherit; text-align: left; color: inherit; border-radius: 3px; scroll-snap-align: start;
    position: relative; overflow: hidden; display: grid; align-content: end; box-shadow: 0 0 0 1px rgba(232, 201, 143, .3); }
  .char img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .char::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5, 7, 22, .92) 0%, rgba(5, 7, 22, .5) 32%, rgba(5, 7, 22, 0) 58%); }
  .char::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 1px; pointer-events: none; }
  .char-text { position: relative; z-index: 1; display: grid; gap: 2px; padding: 0 24px 26px; }
  .char h3 { font-family: var(--mincho); font-weight: 600; font-size: 24px; letter-spacing: .1em; }
  .char-sub { font-size: 12px; letter-spacing: .12em; color: var(--gold); }

  .news { display: grid; padding: 0 24px 160px; }
  .news p { display: grid; gap: 2px; padding: 16px 0; border-top: 1px solid rgba(243, 239, 230, .14); }
  .news p:last-child { border-bottom: 1px solid rgba(243, 239, 230, .14); }
  .news time { font-family: var(--serif); font-size: 14px; letter-spacing: .1em; color: var(--gold); }
  .section .news { padding-top: 0; }

  /* 場所のシート。右から出る。 */
  .sheet-body { height: 100%; box-sizing: border-box; background: var(--page); color: var(--ink); overflow: hidden; border-left: 1px solid rgba(232, 201, 143, .3); }
  .sheet-art { display: block; width: 100%; height: 300px; object-fit: cover; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .sheet-text { display: grid; gap: 10px; padding: 0 24px 24px; margin-top: -20px; position: relative; }
  .sheet-kana { font-size: 12px; letter-spacing: .3em; color: var(--gold); }
  .sheet-body h3 { font-family: var(--mincho); font-weight: 600; font-size: 28px; letter-spacing: .1em; line-height: 1.3; }
  .sheet-text p { font-family: var(--mincho); font-size: 15px; line-height: 1.9; color: rgba(243, 239, 230, .88); }
  /* 最適化なし：よくある fixed の <dialog>。 */
  dialog.sheet { position: fixed; inset: 0 0 0 auto; width: 86%; max-width: none; height: auto; max-height: none; margin: 0; padding: 0; border: 0; outline: none;
    background: none; color: inherit; box-shadow: -12px 0 32px rgba(0, 0, 0, .5); transform: translateX(100%); transition: transform var(--sheet-ms) ease; }
  dialog.sheet.in { transform: none; }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .55); }
  /* 最適化あり：文書の中の absolute の層を、開いた時点のスクロール位置に置く（top は JS）。
     fixed・sticky・最上位の層（<dialog>）は列の縁で切られ、右端に接すると Safari が列を塗りつぶす面を被せるので使わない。 */
  .layer { position: absolute; z-index: 30; top: 0; left: 0; width: 100%; height: 0; }
  .layer[hidden] { display: none; }
  /* 動いている間のはみ出しで文書の幅が広がらないよう、列の奥までの箱で切る。高さはアドレスバーの裏まで。 */
  .layer-clip { position: absolute; top: 0; left: 0; width: calc(100% + var(--gutter)); height: calc(100lvh + 160px); overflow: clip; }
  .layer-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; transition: opacity var(--sheet-ms) ease; }
  /* 幅は「見える範囲の 86%」に列の幅を足したもの（.layer-clip の幅は見える範囲 + 列の幅）。 */
  .layer-sheet { position: absolute; top: 0; right: 0; bottom: 0; width: calc((100% - var(--gutter)) * .86 + var(--gutter)); box-shadow: -12px 0 32px rgba(0, 0, 0, .5); transform: translateX(100%); transition: transform var(--sheet-ms) ease; }
  .layer-sheet .sheet-text { padding-right: calc(24px + var(--gutter)); }
  .layer.in .layer-backdrop { opacity: 1; }
  .layer.in .layer-sheet { transform: none; }
  /* ?mid=1：開く途中の位置で止める（撮影用）。 */
  .mid dialog.sheet, .mid .layer-sheet { transition: none; transform: translateX(50%); }
  .mid .layer-backdrop { transition: none; opacity: .5; }

  /* ===== 最適化あり：右の列の奥まで（--gutter の分だけ）はみ出させる。文字は見える範囲に置く。 ===== */
  /* ヘッダー：上に残し続ける（fixed・sticky）と列の縁で切られるので、KV に重ねてスクロールで流れる absolute にする。 */
  .duo .header { position: absolute; right: auto; width: calc(100% + var(--gutter)); }
  .duo .header-bar { padding-right: calc(20px + var(--gutter)); }
  .duo .hero { margin-right: calc(-1 * var(--gutter)); padding-right: calc(24px + var(--gutter)); }
  .duo .chars { margin-right: calc(-1 * var(--gutter)); padding-right: calc(24px + var(--gutter)); }
</style>
</head>
<body>
<div class="layer" id="layer" hidden>
  <div class="layer-clip">
    <div class="layer-backdrop" id="layer-backdrop"></div>
    <div class="layer-sheet" role="dialog" aria-modal="true" aria-labelledby="layer-name">
      <div class="sheet-body"><img class="sheet-art" id="layer-art" alt=""><div class="sheet-text"><span class="sheet-kana" id="layer-kana"></span><h3 id="layer-name">アルメ港</h3><p id="layer-text"></p></div></div>
    </div>
  </div>
</div>
<header class="header"><div class="header-bar"><span class="logo">ARKLIGHT</span><span class="menu"></span></div></header>
<section class="hero">
  <img class="hero-img" src="assets/hero.jpg" alt="">
  <div class="hero-copy">
    <h1 class="title">ARKLIGHT</h1>
    <p class="title-ja">星灯の航路</p>
    <p class="lead">空に沈んだ世界を、灯台の船で渡る。</p>
    <a class="cta">事前登録する</a>
    <p class="release">2026年12月24日 配信予定</p>
  </div>
</section>
<section class="section" id="chars">
  <div class="section-head"><h2>航路の行き先</h2><p>雲海の港から、星の降る谷まで。</p></div>
  <div class="chars">
    <button class="char" data-name="アルメ港" data-kana="雲海の交易港" data-img="assets/harbor.jpg" data-text="雲の海に浮かぶ交易の港。夜明けごとに、灯台の船団が空へ漕ぎ出す。"><img src="assets/harbor.jpg" alt=""><span class="char-text"><h3>アルメ港</h3><span class="char-sub">雲海の交易港</span></span></button>
    <button class="char" data-name="硝子の尖塔" data-kana="凍てついた峰" data-img="assets/spires.jpg" data-text="凍てついた峰が空へ伸びる。夜には、天幕のようなオーロラが降りる。"><img src="assets/spires.jpg" alt=""><span class="char-text"><h3>硝子の尖塔</h3><span class="char-sub">凍てついた峰</span></span></button>
    <button class="char" data-name="墜星の谷" data-kana="星の欠片が眠る谷" data-img="assets/valley.jpg" data-text="空から落ちた星の欠片が眠る谷。拾い集めると、航路を照らす灯になる。"><img src="assets/valley.jpg" alt=""><span class="char-text"><h3>墜星の谷</h3><span class="char-sub">星の欠片が眠る谷</span></span></button>
    <button class="char" data-name="翠の浮島" data-kana="滝が雲へ落ちる島" data-img="assets/isles.jpg" data-text="滝が雲海へ落ちていく緑の島。島ごとに、違う風が吹いている。"><img src="assets/isles.jpg" alt=""><span class="char-text"><h3>翠の浮島</h3><span class="char-sub">滝が雲へ落ちる島</span></span></button>
  </div>
</section>
<section class="section">
  <div class="section-head"><h2>お知らせ</h2></div>
  <div class="news">
    <p><time>2026.11.30</time>事前登録者数が 100 万人を突破しました。</p>
    <p><time>2026.11.18</time>公式生放送を 12 月 20 日に配信します。</p>
    <p><time>2026.11.02</time>主題歌のアーティストが決まりました。</p>
  </div>
</section>
<!-- 実機の確認の記録の欄。LP の見た目に混ざらないよう、ページの一番下に置く。 -->
<section class="obs-area" id="obs-area">
  <p><a href="index.html">← 一覧へ</a>　<a id="other-mode"></a></p>
</section>
<style>
  .obs-area { display: grid; gap: 12px; padding: 24px 24px 200px; color: #e2e8f0; font-size: 14px; }
  .obs-area a { color: #93c5fd; }
  .obs-area .card { display: grid; gap: 8px; padding: 12px; border: 1px solid #334155; border-radius: 12px; }
  .obs-area .sim { color: #cbd5e1; border-left: 3px solid #64748b; padding-left: 8px; }
  .obs-area .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .obs-area button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #64748b; background: #1e293b; color: #e2e8f0; }
  .obs-area button.on { background: #2563eb; border-color: #2563eb; }
  .obs-area input { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #64748b; background: #0f172a; color: #e2e8f0; }
  .obs-area .muted { color: #94a3b8; }
</style>
<script type="module">
  import { observationBlock } from "./lab.js";

  // モードごとの確認の項目。結果は一覧のページから QR で持ち出す。
  const duoMode = new URLSearchParams(location.search).get("mode") === "duo";
  const other = document.getElementById("other-mode");
  other.href = `lp.html?mode=${duoMode ? "plain" : "duo"}`;
  other.textContent = duoMode ? "最適化なしへ" : "最適化ありへ";
  const ITEMS = duoMode
    ? [
        ["lp:duo-bleed", "KV・ヘッダー・カルーセル・シートが、列の奥（画面の物理的な右端）まで描かれる"],
        ["lp:duo-drag", "ページを横にドラッグしても、ページは横に動かない（押さえている間も）"],
        ["lp:duo-carousel", "カルーセルの上で横にスワイプすると、カルーセルだけが動く"],
        ["lp:duo-pinchout", "ピンチで縮めても 1 倍で止まる（タブの一覧が開くのは Safari の普段の動き）"],
        ["lp:duo-zoompan", "ピンチで拡大すると、横にも見て回れる。等倍に戻すと、また横に動かなくなる"],
        ["lp:duo-sheet", "シートが画面の右端から滑り込み、列の下とアドレスバーの裏まで覆う。開いている間は後ろのページが動かない"],
        ["lp:duo-doubletap", "未確認。シートを開いたままダブルタップしたとき、拡大して戻せなくならないか（Bug 325368 の恐れ）"],
      ]
    : [
        ["lp:plain-cut", "ヘッダー・KV・カルーセルが列の縁でぷつりと切れる"],
        ["lp:plain-sheet", "シートが列の縁から湧き出るように出て、開いた後も右は列の縁、下はアドレスバーの上で切れる"],
      ];
  const area = document.getElementById("obs-area");
  for (const [id, expected] of ITEMS) {
    const block = document.createElement("div");
    area.append(block);
    observationBlock(block, id, expected);
  }
</script>
<dialog class="sheet" id="sheet">
  <div class="sheet-body"><img class="sheet-art" id="sheet-art" alt=""><div class="sheet-text"><span class="sheet-kana" id="sheet-kana"></span><h3 id="sheet-name">アルメ港</h3><p id="sheet-text"></p></div></div>
</dialog>
<script>
  const params = new URLSearchParams(location.search);
  const root = document.documentElement;
  const duo = params.get("mode") === "duo";
  root.classList.add(duo ? "duo" : "plain");
  if (params.get("slow") === "1") root.style.setProperty("--sheet-ms", "3s");
  const sheet = document.getElementById("sheet");
  const layer = document.getElementById("layer");
  const nextFrame = (callback) => requestAnimationFrame(() => requestAnimationFrame(callback));
  let fit = () => {};

  if (duo) {
    // 等倍より縮めると、列の奥に置いた分まで画面に収めようとして 0.82 倍まで縮むので止める。
    document.querySelector('meta[name="viewport"]').content += ", minimum-scale=1";
    // 右の列の幅を測って --gutter に入れ、はみ出しで生まれる横揺れを止める。
    // 列の幅は CSS では取れない（env(safe-area-inset-right) は 0）。列の無い端末では 0 になる。
    // 横揺れは、等倍の間だけ touch-action で横の移動を止め、拡大したら外して見て回れるようにする。
    // シートを開いている間は、後ろのページを動かさない（none）。
    fit = () => {
      const zoomed = visualViewport.scale > 1.01;
      root.style.touchAction = !layer.hidden ? "none" : zoomed ? "" : "pan-y pinch-zoom";
      if (zoomed) return;
      if (scrollX !== 0) scrollTo(0, scrollY);
      const portrait = matchMedia("(orientation: portrait)").matches;
      const gutter = portrait ? Math.max(0, screen.width - root.clientWidth) : 0;
      root.style.setProperty("--gutter", `${gutter}px`);
    };
    visualViewport.addEventListener("resize", fit);
    visualViewport.addEventListener("scroll", fit);
    addEventListener("resize", fit);
    fit();
  }

  const mid = params.get("mid") === "1";
  if (mid) root.classList.add("mid");
  const fill = (prefix, card) => {
    document.getElementById(`${prefix}-name`).textContent = card.dataset.name;
    document.getElementById(`${prefix}-kana`).textContent = card.dataset.kana;
    document.getElementById(`${prefix}-text`).textContent = card.dataset.text;
    document.getElementById(`${prefix}-art`).src = card.dataset.img;
  };

  function openSheet(card) {
    if (duo) {
      fill("layer", card);
      layer.style.top = `${scrollY}px`;
      layer.hidden = false;
      fit();
      if (!mid) nextFrame(() => layer.classList.add("in"));
    } else {
      fill("sheet", card);
      sheet.showModal();
      if (!mid) nextFrame(() => sheet.classList.add("in"));
    }
  }
  for (const card of document.querySelectorAll(".char")) card.addEventListener("click", () => openSheet(card));
  sheet.addEventListener("click", (event) => { if (event.target === sheet) sheet.close(); });
  sheet.addEventListener("close", () => sheet.classList.remove("in"));
  document.getElementById("layer-backdrop").addEventListener("click", () => layer.classList.remove("in"));
  layer.addEventListener("transitionend", () => {
    if (layer.classList.contains("in")) return;
    layer.hidden = true;
    fit();
  });

  addEventListener("load", () => {
    if (params.get("at") === "chars") document.getElementById("chars").scrollIntoView({ block: "start" });
    if (params.get("open") === "1") setTimeout(() => openSheet(document.querySelector(".char")), 1500);
  });

  // ?debug=1：測定用。要所の値を測定のサーバーへ送る。
  if (params.get("debug") === "1") {
    const rect = (selector) => {
      const r = document.querySelector(selector).getBoundingClientRect();
      return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom)];
    };
    const send = (event) => navigator.sendBeacon("/log", JSON.stringify({
      label: `lp-${params.get("mode")}`, event, t: Math.round(performance.now()),
      inner: [innerWidth, innerHeight], scroll: [scrollX, scrollY],
      scrollSize: [root.scrollWidth, root.scrollHeight], scale: visualViewport.scale,
      gutter: getComputedStyle(root).getPropertyValue("--gutter"), touchAction: root.style.touchAction,
      header: rect(".header-bar"), hero: rect(".hero"), chars: rect(".chars"), layerClip: rect(".layer-clip"),
      headerStyle: getComputedStyle(document.querySelector(".header")).position,
      charsScrollLeft: document.querySelector(".chars").scrollLeft,
    }));
    send("script");
    let settle;
    const later = (event) => () => { clearTimeout(settle); settle = setTimeout(() => send(event), 400); };
    addEventListener("scroll", later("scroll-end"));
    document.querySelector(".chars").addEventListener("scroll", later("chars-scroll-end"));
    addEventListener("load", () => send("load"));
    for (const ms of [1000, 3000, 7000]) setTimeout(() => send(`t${ms}`), ms);
  }
</script>
</body>
</html>
